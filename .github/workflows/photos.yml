# Downloads mineral, rock, fossil and lesson pictures from Wikimedia Commons and commits them to the branch.
# Runs when the photo list changes; images and credits land in images/ and data/image_credits.json.
name: Fetch photos

on:
  push:
    paths:
      - tools/fetch_photos.py
      - data/minerals.json
      - data/rocks.json
      - data/fossils.json
      - data/lessons.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download photos
        run: python tools/fetch_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add images data/image_credits.json
          git diff --cached --quiet || (git commit -m "Update mineral and rock photos" && git push)
